plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.smartvisionai'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smartvisionai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
        // TODO: Replace with your actual Gemini API key
        buildConfigField "String", "GEMINI_API_KEY", "\"YOUR_GEMINI_API_KEY_HERE\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    // --- Core ---
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel

    // --- UI & Material Components ---
    implementation 'com.google.android.material:material:1.12.0'

    // --- Jetpack Compose BOM ---
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.foundation

    // --- Navigation ---
    implementation libs.androidx.navigation.compose

    // --- CameraX ---
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.extensions

    // --- ML Kit ---
    implementation libs.mlkit.text.recognition
    implementation libs.mlkit.object.detection
    implementation libs.mlkit.image.labeling
    implementation libs.mlkit.language.id
    implementation libs.mlkit.translate

    // --- TensorFlow Lite ---
    implementation libs.tensorflow.lite
    implementation libs.tensorflow.lite.support
    implementation libs.tensorflow.lite.metadata
    implementation libs.tensorflow.lite.task.vision

    // --- Gemini AI ---
    implementation libs.gemini.generativeai

    // --- Firebase ---
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.firebase.auth
    implementation libs.firebase.storage

    // --- Hilt DI ---
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.hilt.navigation.compose

    // --- Room (local history) ---
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    kapt libs.androidx.room.compiler

    // --- DataStore (settings) ---
    implementation libs.androidx.datastore.preferences

    // --- Coil (image loading) ---
    implementation libs.coil.compose

    // --- Accompanist (permissions) ---
    implementation libs.accompanist.permissions

    // --- Lottie animations ---
    implementation 'com.airbnb.android:lottie-compose:6.2.0'

    // --- Coroutines ---
    implementation libs.kotlinx.coroutines.android

    implementation "androidx.compose.ui:ui:1.6.0"

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test

}

kapt { correctErrorTypes = true }
