[versions]
agp               = "8.7.3"
kotlin            = "2.1.0"
hilt              = "2.55"
googleServices    = "4.4.2"
room              = "2.8.4"
ksp               = "2.1.0-1.0.29"
firebaseBom       = "33.7.0"
generativeai      = "0.9.0"
accompanist       = "0.37.2"

[libraries]
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage-ktx" }

# AI & ML
google-generativeai = { group = "com.google.ai.client.generativeai", name = "generativeai", version.ref = "generativeai" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version = "17.3.0" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version = "16.0.1" }
mlkit-image-labeling = { group = "com.google.mlkit", name = "image-labeling", version = "17.0.9" }
mlkit-object-detection = { group = "com.google.mlkit", name = "object-detection", version = "17.0.2" }

# Accompanist
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

[plugins]
android-application = { id = "com.android.application",       version.ref = "agp"            }
kotlin-android      = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin"         }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin"   }
hilt-android        = { id = "com.google.dagger.hilt.android", version.ref = "hilt"          }
google-services     = { id = "com.google.gms.google-services", version.ref = "googleServices"}
ksp                 = { id = "com.google.devtools.ksp",       version.ref = "ksp"            }
