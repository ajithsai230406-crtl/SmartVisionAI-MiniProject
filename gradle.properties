org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -Dsun.zip.disableMemoryMapping=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.useKSP2=true

# Disabling VFS watch can release locks on Windows
org.gradle.vfs.watch=false

# Helps avoid some locking issues by limiting parallel execution during clean
org.gradle.workers.max=4

# Potential fix for R.jar locking
android.enableResourceOptimizations=false

# Disable configuration cache and build cache if they are causing issues on Windows
org.gradle.configuration-cache=false
org.gradle.caching=false
